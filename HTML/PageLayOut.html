<!DOCTYPE html>
<html>
<head>
    <title>Table, Row and Data</title>
</head>
<body>

<table border="1" width="100%" height="600">

    <!-- Header -->
    <tr height="10%">
        <td colspan="2" align="center">
            &lt;header&gt;
        </td>
    </tr>

    <!-- Navigation -->
    <tr height="10%">
        <td colspan="2" align="center">
            &lt;nav&gt;
        </td>
    </tr>

    <!-- Content Area -->
    <tr height="60%">

        <!-- Left Content -->
        <td width="75%" valign="top" align="center">

            &lt;section&gt;

            <table border="1" width="100%">
                <tr>
                    <td align="center">Heading</td>
                </tr>

                <tr height="200">
                    <td align="center">
                        &lt;article&gt;
                    </td>
                </tr>
            </table>

        </td>

        <!-- Right Sidebar -->
        <td width="25%" valign="top" align="center">
            &lt;aside&gt;
        </td>

    </tr>

    <!-- Footer -->
    <tr height="20%">
        <td colspan="2" align="center">
            &lt;footer&gt;
        </td>
    </tr>

</table>

</body>
</html>
