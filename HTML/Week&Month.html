<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Dtate of birth formate</title>
    </head>
    <body>
        <h2>Chipi technologies - Date of birth unput Exmple:</h2>

        <form>
            <label for="week1">1.Select any week: </label>
            <input type="week" id="week1" name="week1"> <br> <br>

             <label for="dob2">2. DOB with age restriction: </label>
            <input type="month" id="dob2" name="dob1" min="1985-01-01" max="2099-01-12"><br><br>

            <label for="dob3">3. DOB with Default value: </label>
            <input type="year" id="dob3" name="dob3" value="2012-02-12" min="1985-01-01" max="2099-01-12"><br><br>

             <label for="dob4">4. Requird DOB (mandatory Field) </label>
            <input type="date" id="dob4" name="dob4" required value="2012-02-12" min="1985-01-01" max="2099-01-12"><br><br>

            <label for="dob5">5 Read-only DOB (view only)</label>
            <input type="date" id="dob5" name="dob5" required value="2012-02-12" readonly min="1985-01-01" max="2099-01-12" readonly><br><br>

            <label for="dob6">6. Disable DOB (Not editable) </label>
            <input type="date" id="dob6" name="dob6" required value="2012-02-12" min="1985-01-01" max="2099-01-12" disabled><br><br>
        </form>

        <input type="submit" value="Submit form" onclick="alert('Submit successfully')">
        <input type="reset" value="Clear Form" onclick="alert('Clear successfully')">

    </body>
</html>
