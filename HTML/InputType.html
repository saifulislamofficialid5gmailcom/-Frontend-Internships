<!DOCTYPE html>
<html>
    <head>
        <title>Input Type text</title>
    </head>
    <body>
        <form>
            <label for="fname">:First Name</label>
            <input type="text" placeholder="Enter the first name" name="firstname" id="fname"><br><br>

            <label for="lname">Last Name:</label>
            <input type="text" placeholder="Enter the last name" name="lastname" id="lname">
            <br>
            <br>
            <input type="reset" value="cancel">
            <input type="submit" value="Save">
        </form>
    </body>
</html>
