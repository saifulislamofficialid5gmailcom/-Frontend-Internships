<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Data List</title>
</head>
<body>

    <h2>Chipi Technologies - Course Registration</h2>

    <form>

        <label for="studentname">Student Name</label>
        <input type="text"
               id="studentname"
               name="studentname"
               placeholder="e.g., Saiful, Fahrin Sultana">
        <br><br>

        <label for="course">Select Your Course</label>
        <br><br>

        <input list="courses"
               id="course"
               name="course"
               placeholder="e.g., Java, Python">

        <datalist id="courses">
            <option value="Java Programming">
            <option value="C Programming">
            <option value="DBMS">
            <option value="SQL">
            <option value="Python">
            <option value="C++">
            <option value="HTML">
            <option value="CSS">
            <option value="JavaScript">
        </datalist>

        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear Form">
    </form>
    <p>&copy; Saiful islam. All right reserved</p>

</body>
</html>
