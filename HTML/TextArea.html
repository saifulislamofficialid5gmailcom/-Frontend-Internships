<!DOCTYPE html>
<html>
    <head>
        <title>Text Area</title>
    </head>
    <body>
        <h2>Chipi Technology - Student feedback</h2>
        <form>
            <label for="studentName">Your name: </label>
            <input type="text"  id="studentName" placeholder="Enter your name"><br><br>

            <label for="feedback">Your feedback</label>
            <textarea id="feedback" name="feedback" rows="5" cols="40" placeholder="Write your thought here.......,"></textarea><br><br>
            
            <input type="submit" value="submit Feedback">
            <input type="reset" value="Clear form">
            <p>&copy; 2026 saiful islam. All right reserved.</p>
        </form>
    </body>
</html>
