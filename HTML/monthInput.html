<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Chipi technlogy - month input</title>
    </head>
    <body>
        <form>
            <label for="month1">1. Basic month input</label><br><br>
            <input type="month" id="month1" name="month1"><br><br>

            <label for="month2">2. Basic month input</label><br><br>
            <input type="month" id="month2" name="month2" min="2000-01" max="2020-12"><br><br>

            <label for="month3">3. Basic month input</label><br><br>
            <input type="month" id="month3" name="month3" value="2020-01"><br><br>
            
            <label for="month4">4. Basic month input</label><br><br>
            <input type="month" id="month4" name="month4" required min="2000-01" max="2020-12" max="2030-12"><br><br>

            <label for="month5">5. Basic month input</label><br><br>
            <input type="month" id="month5" name="month5" disabled><br><br>

            <label for="month6">6. Basic month input</label><br><br>
            <input type="month" id="month6" name="month6" readonly value="2030-12" disabled><br><br>
        </form>
    </body>
</html>
